name: Refresh Data
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Generate fresh data
        run: go run ./cmd/generate --output data/zipcodes.csv.gz

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/zipcodes.csv.gz; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: go test -race -count=1 ./...

      - name: Compute version
        if: steps.diff.outputs.changed == 'true'
        id: version
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          PREFIX="v0.${YEAR}.${MONTH}"

          LATEST=$(git tag --list "${PREFIX}*" --sort=-v:refname | head -n1)

          if [ -z "$LATEST" ]; then
            PATCH=0
          else
            EXISTING_PATCH=$(echo "$LATEST" | grep -oE '[0-9]+$')
            PATCH=$((EXISTING_PATCH + 1))
          fi

          TAG="${PREFIX}${PATCH}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed next tag: ${TAG}"

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/zipcodes.csv.gz
          git commit -m "data: refresh zip code data (${{ steps.version.outputs.tag }})"

      - name: Tag and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin main --tags

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "Data unchanged, skipping release."
