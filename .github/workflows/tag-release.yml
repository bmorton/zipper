name: Tag Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release in CalVer format (e.g. v0.2026.41)"
        required: true
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v0\.[0-9]{4}\.[0-9]+$ ]]; then
            echo "::error::Version must match CalVer v0.YYYY.MMPATCH (e.g. v0.2026.41)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create and push tag
        run: |
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
